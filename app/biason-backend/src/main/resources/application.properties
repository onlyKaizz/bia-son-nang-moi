# Server Port
server.port=${PORT:8080}
spring.application.name=biason-backend

# Datasource: Supports PostgreSQL via DATABASE_URL / SPRING_DATASOURCE_URL, falls back to persistent H2 file
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:h2:file:./data/biason;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${DB_USERNAME:sa}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${DB_PASSWORD:}}}

# JPA / Hibernate: auto create / update schema on both H2 & Postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console (disabled on production cloud)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
