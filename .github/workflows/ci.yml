name: CI Build & Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/biason-frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd app/biason-frontend
          npm ci

      - name: TypeScript & Vite Build
        run: |
          cd app/biason-frontend
          npm run build
